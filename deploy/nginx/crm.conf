# nginx на VPS: https://yosia.ru → контейнер сайта (слушает только 127.0.0.1:8080).
# Устанавливается в /etc/nginx/sites-available/crm (см. DEPLOY.md).
# Сертификат Let's Encrypt (certbot, webroot /var/www/certbot) продлевается certbot.timer,
# после продления nginx перезагружается хуком /etc/letsencrypt/renewal-hooks/deploy/reload-nginx.sh.

# HTTP (в том числе запросы по IP): только проверка домена для Let's Encrypt, остальное — на HTTPS
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://yosia.ru$request_uri;
    }
}

# www → без www
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.yosia.ru;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/yosia.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yosia.ru/privkey.pem;

    return 301 https://yosia.ru$request_uri;
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name yosia.ru;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/yosia.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yosia.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS только для yosia.ru (без поддоменов); заголовок бекенда (с includeSubDomains) скрываем
    add_header Strict-Transport-Security "max-age=31536000" always;
    proxy_hide_header Strict-Transport-Security;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 2m;

    # Живые обновления (SSE): без буферизации, соединение держится долго
    location = /api/events {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
